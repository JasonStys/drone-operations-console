# Jason Stys: trusted-main source-green Windows draft assembly; no public publish, overwrite, Actions artifacts or caches.
name: Windows release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact current product version (new tag/draft only)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      security-events: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: { python-version: "3.14.10", check-latest: true }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: "24", package-manager-cache: false }
      - run: python -m pip install --require-hashes -r requirements-desktop.lock
      - name: Require exact current main workflows, aggregate CodeQL and absent release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.release_preflight prepare --version "$env:RELEASE_VERSION"
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm test && npm run test:lifecycle
      - run: npm run build
      - run: python tools/build_desktop.py
      - run: npm run package:desktop
      - run: python -m tools.build_lifetime_fixture
      - run: npm run test:desktop
      - name: Recheck exact main and assemble a new verified draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.release_preflight draft --version "$env:RELEASE_VERSION"
