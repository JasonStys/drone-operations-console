[project]
name = "drone-operations-console"
version = "0.1.0"
description = "Simulator-only fleet operations and auditable mission control by Jason Stys"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["console"]
omit = ["console/__main__.py", "console/px4.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"tools/*" = ["S105", "S106", "S603"]
"console/px4.py" = ["S603"]
